# Merge this container and the serviceAccountName into the JiuwenSwarm Pod template.
spec:
  serviceAccountName: agent-monitor
  containers:
    - name: agent-four-layer-monitor
      image: registry.example.com/agent-tracer-monitor:0.1.0
      imagePullPolicy: IfNotPresent
      args:
        - --agent-project
        - /workspace/jiuwenswarm
        - --system-id
        - jiuwenswarm-production
        - --endpoint
        - http://agent-tracer.agent-observability.svc:5000/api/v1/monitor/events:batch
        - --interval
        - "15"
        - --kubernetes
        - "on"
        - --cgroup
        - "off"
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DCGM_EXPORTER_URL
          value: http://dcgm-exporter.gpu-operator.svc:9400/metrics
        - name: NPU_EXPORTER_URL
          value: http://npu-exporter.agent-system.svc:8082/metrics
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
