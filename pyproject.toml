[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tracer"
version = "0.1.0"
description = "Agent OTel Trace parsing, graph analysis, diagnosis, and monitoring system"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0",
  "flask>=3.0.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
dataset = ["datasets>=2.19.0"]
otlp-collector = ["grpcio>=1.60.0", "opentelemetry-proto>=1.24.0"]

[project.scripts]
otl-trace = "agent_tracer.cli:otl_trace"
pruning-strategies = "agent_tracer.cli:pruning_strategies"
deepseek-judge = "agent_tracer.cli:deepseek_judge"
agent-tracer = "agent_tracer.cli:run_single_trace"
deepseek-align = "agent_tracer.cli:deepseek_align"
deepseek-unprocessed-eval = "agent_tracer.cli:deepseek_unprocessed_eval"
pipeline-run = "agent_tracer.cli:pipeline_run"
run-all-in-one = "agent_tracer.cli:run_all_in_one"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tracer"]

